<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">QuantFabric 系统架构图</title>
  <desc id="desc">后台管理、行情、风控、交易柜台、历史数据和回测服务的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1720"/>
      <stop offset="1" stop-color="#172536"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7fa8c9"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #e7eef5; }
      .title { font-size: 28px; font-weight: 700; }
      .lane { font-size: 18px; font-weight: 700; fill: #8fc4e8; }
      .box-title { font-size: 17px; font-weight: 700; }
      .box-note { font-size: 13px; fill: #a8bac9; }
      .box { stroke-width: 1.5; rx: 10; filter: url(#shadow); }
      .control { fill: #20364a; stroke: #4d84ad; }
      .trade { fill: #243d35; stroke: #4fa88b; }
      .data { fill: #3b344c; stroke: #9c7bc5; }
      .adapter { fill: #47392c; stroke: #c49a5b; }
      .line { fill: none; stroke: #7fa8c9; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
      .label { font-size: 13px; fill: #b9c9d6; }
    </style>
  </defs>

  <rect width="1440" height="820" fill="url(#bg)"/>
  <text x="720" y="52" text-anchor="middle" class="text title">QuantFabric 量化交易平台架构</text>

  <text x="48" y="104" class="text lane">控制面（配置与权限）</text>
  <rect x="48" y="124" width="250" height="92" class="box control"/>
  <text x="173" y="161" text-anchor="middle" class="text box-title">BusinessAdmin</text>
  <text x="173" y="188" text-anchor="middle" class="text box-note">证券 / 账户 / 版本 / 审计</text>
  <rect x="400" y="124" width="250" height="92" class="box control"/>
  <text x="525" y="161" text-anchor="middle" class="text box-title">AuthAdmin + Casbin</text>
  <text x="525" y="188" text-anchor="middle" class="text box-note">登录、角色与操作权限</text>
  <rect x="752" y="124" width="250" height="92" class="box control"/>
  <text x="877" y="161" text-anchor="middle" class="text box-title">XServer 策略</text>
  <text x="877" y="188" text-anchor="middle" class="text box-note">加载已发布业务规则</text>
  <path d="M298 170 H395" class="line"/>
  <path d="M650 170 H747" class="line"/>
  <text x="348" y="157" text-anchor="middle" class="label">发布配置</text>
  <text x="700" y="157" text-anchor="middle" class="label">授权校验</text>

  <text x="48" y="282" class="text lane">交易面（实时行情与委托）</text>
  <rect x="48" y="304" width="250" height="100" class="box control"/>
  <text x="173" y="344" text-anchor="middle" class="text box-title">vn.py 交易工作台</text>
  <text x="173" y="371" text-anchor="middle" class="text box-note">选股、K 线、委托、资金</text>
  <rect x="400" y="304" width="250" height="100" class="box trade"/>
  <text x="525" y="344" text-anchor="middle" class="text box-title">quantfabric_native</text>
  <text x="525" y="371" text-anchor="middle" class="text box-note">原生 PackMessage / SHM</text>
  <rect x="752" y="304" width="250" height="100" class="box trade"/>
  <text x="877" y="344" text-anchor="middle" class="text box-title">XServer / XWatcher</text>
  <text x="877" y="371" text-anchor="middle" class="text box-note">会话、路由与监控</text>
  <rect x="1104" y="304" width="250" height="100" class="box trade"/>
  <text x="1229" y="344" text-anchor="middle" class="text box-title">XRiskJudge → XTrader</text>
  <text x="1229" y="371" text-anchor="middle" class="text box-note">风控、订单与回报</text>
  <path d="M298 354 H395" class="line"/>
  <path d="M650 354 H747" class="line"/>
  <path d="M1002 354 H1099" class="line"/>
  <path d="M877 216 V298" class="line dashed"/>
  <text x="905" y="264" class="label">规则校验</text>

  <rect x="1104" y="488" width="250" height="100" class="box adapter"/>
  <text x="1229" y="528" text-anchor="middle" class="text box-title">ATP SDK / AGW</text>
  <text x="1229" y="555" text-anchor="middle" class="text box-note">测试柜台 610000071840</text>
  <path d="M1229 404 V482" class="line"/>

  <text x="48" y="492" class="text lane">数据面（行情、历史与研究）</text>
  <rect x="48" y="514" width="250" height="100" class="box adapter"/>
  <text x="173" y="554" text-anchor="middle" class="text box-title">PyTdxBridge</text>
  <text x="173" y="581" text-anchor="middle" class="text box-note">实时行情适配器</text>
  <rect x="400" y="514" width="250" height="100" class="box trade"/>
  <text x="525" y="554" text-anchor="middle" class="text box-title">XMarketCenter</text>
  <text x="525" y="581" text-anchor="middle" class="text box-note">标准化行情发布</text>
  <path d="M298 564 H395" class="line"/>
  <path d="M525 514 V410" class="line dashed"/>
  <text x="550" y="469" class="label">实时行情</text>

  <rect x="752" y="514" width="250" height="100" class="box data"/>
  <text x="877" y="554" text-anchor="middle" class="text box-title">ClickHouse</text>
  <text x="877" y="581" text-anchor="middle" class="text box-note">tdxdata 分钟 K 线</text>
  <rect x="1104" y="650" width="250" height="100" class="box data"/>
  <text x="1229" y="690" text-anchor="middle" class="text box-title">HistoryDataService</text>
  <text x="1229" y="717" text-anchor="middle" class="text box-note">历史查询与权限校验</text>
  <rect x="752" y="650" width="250" height="100" class="box data"/>
  <text x="877" y="690" text-anchor="middle" class="text box-title">BacktestService</text>
  <text x="877" y="717" text-anchor="middle" class="text box-note">均线策略 / 收益与回撤</text>
  <path d="M877 614 V644" class="line"/>
  <path d="M1104 700 H1007" class="line"/>
  <path d="M752 700 H650 V404" class="line dashed"/>
  <text x="674" y="650" class="label">只读研究数据</text>

  <text x="48" y="790" class="text box-note">实线：运行时数据链路　　虚线：配置或只读数据链路</text>
</svg>
